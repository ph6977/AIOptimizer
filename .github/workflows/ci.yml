name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Run Ruff
        run: ruff check .

      - name: Run Black (check)
        run: black --check .

      - name: Run MyPy
        run: mypy --strict app/

      - name: Run Pytest
        run: pytest tests/ -v

  build-windows:
    runs-on: windows-latest
    needs: lint-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Build with PyInstaller
        run: |
          pip install pyinstaller
          pyinstaller --noconfirm --onefile --windowed --name AIOptimizer main.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: AIOptimizer-windows
          path: dist/AIOptimizer.exe
          retention-days: 7